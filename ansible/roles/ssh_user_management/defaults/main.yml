---
# Default variables for SSH user management role

# User configuration source
user_mapping_file: "{{ playbook_dir }}/../../config/user-mapping.json"

# Default user settings
default_shell: /bin/bash
default_group: users
user_home_base: /home

# GitHub settings
github_keys_base_url: "https://github.com"

# Nur noch zum Aufräumen alter Sicherungen — die Rolle legt keine mehr an
backup_dir: /var/backups/ssh-user-management

# Konten, die je in der Benutzerliste standen — nur die löscht die Rolle beim Entzug.
# Derselbe Pfad, den die Cloud-Config des Cockpits anlegt.
managed_users_file: /var/lib/ssh-user-management/managed-users

# Nie anfassen. Entspricht RESERVED_LOCAL_USERS im Cockpit; das Anmeldekonto
# des Laufs kommt zur Laufzeit dazu.
protected_users:
  - root
  - ansible
  - daemon
  - bin
  - sys
  - sync
  - games
  - man
  - mail
  - news
  - proxy
  - www-data
  - backup
  - list
  - irc
  - nobody
  - sshd
  - systemd-network
  - systemd-resolve

# Logging
enable_logging: true
log_dir: /var/log/ssh-user-management
