---
# Task file to manage individual user
#
# Geschuetzte Konten (root, ansible, Systemkonten) werden hier gar nicht erst
# verarbeitet: Ein Eintrag mit dem Namen root wuerde sonst dessen Shell, Gruppen
# und Schluessel ueberschreiben.

- name: "{{ user_item.local_user }} | GESCHUETZTES KONTO — uebersprungen"
  ansible.builtin.debug:
    msg: >-
      ABGEWIESEN: {{ user_item.local_user }} steht unter Schutz und wird nicht
      verwaltet. Steht dieser Name in der Benutzerliste, stimmt etwas mit den
      Daten nicht.
  when: user_item.local_user in protected_users
  tags: [users]

- name: "{{ user_item.local_user }} | Check if user exists"
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_item.local_user }}"
    fail_key: false
  register: user_exists
  tags: [users]

- name: "{{ user_item.local_user }} | Create user"
  ansible.builtin.user:
    name: "{{ user_item.local_user }}"
    comment: "{{ user_item.full_name | default(user_item.local_user) }}"
    shell: "{{ user_config.config.default_shell | default(default_shell) }}"
    home: "{{ user_home_base }}/{{ user_item.local_user }}"
    create_home: true
    state: present
  when: user_exists.ansible_facts.getent_passwd is not defined or user_exists.ansible_facts.getent_passwd[user_item.local_user] is not defined
  tags: [users, create]

# Merkzettel, welche Konten diese Rolle selbst angelegt hat. Nur diese werden
# beim Entzug vollstaendig geloescht — handgemachte Konten mit womoeglich
# wichtigen Home-Verzeichnissen werden lediglich gesperrt.
- name: "{{ user_item.local_user }} | Als vom Cockpit angelegt vermerken"
  ansible.builtin.lineinfile:
    path: "{{ managed_users_file }}"
    line: "{{ user_item.local_user }}"
    create: true
    mode: '0644'
  when: user_exists.ansible_facts.getent_passwd is not defined or user_exists.ansible_facts.getent_passwd[user_item.local_user] is not defined
  tags: [users, create]

- name: "{{ user_item.local_user }} | Add user to groups"
  ansible.builtin.user:
    name: "{{ user_item.local_user }}"
    groups: "{{ user_item.groups | join(',') }}"
    append: true
  when: user_item.groups is defined and user_item.groups | length > 0
  tags: [users, groups]

- name: "{{ user_item.local_user }} | Import SSH keys from GitHub"
  ansible.builtin.include_tasks: import_github_keys.yml
  when: user_item.github_user is defined
  tags: [users, ssh_keys]

- name: "{{ user_item.local_user }} | Configure sudo access"
  ansible.builtin.include_tasks: configure_sudo.yml
  when: user_item.sudo_access is defined
  tags: [users, sudo]
