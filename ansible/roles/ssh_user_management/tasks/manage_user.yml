---
# Task file to manage individual user

- name: "{{ user_item.local_user }} | Check if user exists"
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_item.local_user }}"
    fail_key: false
  register: user_exists
  tags: [users]

- name: "{{ user_item.local_user }} | Create user"
  ansible.builtin.user:
    name: "{{ user_item.local_user }}"
    comment: "{{ user_item.full_name | default(user_item.local_user) }}"
    shell: "{{ user_config.config.default_shell | default(default_shell) }}"
    home: "{{ user_home_base }}/{{ user_item.local_user }}"
    create_home: true
    state: present
  # Mit fail_key: false liefert getent den Schlüssel auch für ein fehlendes
  # Konto — nur mit leerem Wert. Die frühere Prüfung "is not defined" traf
  # deshalb nie zu, und neue Konten wurden nie angelegt.
  when: (user_exists.ansible_facts.getent_passwd | default({})).get(user_item.local_user) is none
  tags: [users, create]

# Wer in der Benutzerliste steht, gilt ab jetzt als verwaltet — auch ein Konto,
# das es vor der Automatik schon gab. Bestehende Zugänge sollen ins Cockpit
# übergehen, nicht dauerhaft neben ihm herlaufen. Fällt die Person später aus
# der Liste, wird ihr Konto deshalb wie jedes andere entfernt.
- name: "{{ user_item.local_user }} | Register account as managed"
  ansible.builtin.lineinfile:
    path: "{{ managed_users_file }}"
    line: "{{ user_item.local_user }}"
    create: true
    mode: '0644'
  tags: [users, create]

- name: "{{ user_item.local_user }} | Add user to groups"
  ansible.builtin.user:
    name: "{{ user_item.local_user }}"
    groups: "{{ user_item.groups | join(',') }}"
    append: true
  when: user_item.groups is defined and user_item.groups | length > 0
  # Im Trockenlauf legt die vorige Aufgabe fehlende Gruppen nur zum Schein an;
  # die Zuweisung fände sie dann nicht. Im echten Lauf gilt jeder Fehler.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [users, groups]

- name: "{{ user_item.local_user }} | Import SSH keys from GitHub"
  ansible.builtin.include_tasks: import_github_keys.yml
  when: user_item.github_user is defined
  tags: [users, ssh_keys]

- name: "{{ user_item.local_user }} | Configure sudo access"
  ansible.builtin.include_tasks: configure_sudo.yml
  when: user_item.sudo_access is defined
  tags: [users, sudo]
