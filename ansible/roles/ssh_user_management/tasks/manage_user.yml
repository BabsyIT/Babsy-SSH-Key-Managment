---
# Task file to manage individual user

# `id` statt getent: getent gibt es auf macOS nicht, `id` überall.
- name: "{{ user_item.local_user }} | Check if user exists"
  ansible.builtin.command:
    argv: [id, -u, "{{ user_item.local_user }}"]
  register: user_exists
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [users]

- name: "{{ user_item.local_user }} | Create user"
  ansible.builtin.user:
    name: "{{ user_item.local_user }}"
    comment: "{{ user_item.full_name | default(user_item.local_user) }}"
    shell: "{{ user_config.config.default_shell | default(default_shell) }}"
    home: "{{ home_basis }}/{{ user_item.local_user }}"
    create_home: true
    state: present
  # Früher mit getent und "is not defined" — das traf nie zu, neue Konten
  # wurden nie angelegt. `id` scheitert eindeutig, wenn es das Konto nicht gibt.
  when: user_exists.rc != 0
  tags: [users, create]

# Wer in der Benutzerliste steht, gilt ab jetzt als verwaltet — auch ein Konto,
# das es vor der Automatik schon gab. Bestehende Zugänge sollen ins Cockpit
# übergehen, nicht dauerhaft neben ihm herlaufen. Fällt die Person später aus
# der Liste, wird ihr Konto deshalb wie jedes andere entfernt.
- name: "{{ user_item.local_user }} | Register account as managed"
  ansible.builtin.lineinfile:
    path: "{{ managed_users_file }}"
    line: "{{ user_item.local_user }}"
    create: true
    mode: '0644'
  tags: [users, create]

- name: "{{ user_item.local_user }} | Add user to groups"
  ansible.builtin.user:
    name: "{{ user_item.local_user }}"
    groups: "{{ user_item.groups | join(',') }}"
    append: true
  when: user_item.groups is defined and user_item.groups | length > 0
  # Im Trockenlauf legt die vorige Aufgabe fehlende Gruppen nur zum Schein an;
  # die Zuweisung fände sie dann nicht. Im echten Lauf gilt jeder Fehler.
  ignore_errors: "{{ ansible_check_mode }}"
  tags: [users, groups]

- name: "{{ user_item.local_user }} | Import SSH keys from GitHub"
  ansible.builtin.include_tasks: import_github_keys.yml
  when: user_item.github_user is defined
  tags: [users, ssh_keys]

- name: "{{ user_item.local_user }} | Configure sudo access"
  ansible.builtin.include_tasks: configure_sudo.yml
  when: user_item.sudo_access is defined
  tags: [users, sudo]

# Ist unter macOS «Entfernte Anmeldung» auf bestimmte Benutzer beschränkt,
# lässt sshd nur Mitglieder von com.apple.access_ssh herein. Ohne Aufnahme
# wäre das Konto angelegt und hätte Schlüssel, käme aber nie hinein.
- name: "{{ user_item.local_user }} | Check macOS remote login restriction"
  ansible.builtin.command:
    argv: [dscl, ., -read, /Groups/com.apple.access_ssh]
  register: access_ssh_gruppe
  changed_when: false
  failed_when: false
  check_mode: false
  when: ist_macos
  tags: [users]

- name: "{{ user_item.local_user }} | Allow remote login on macOS"
  ansible.builtin.command:
    argv: [dseditgroup, -o, edit, -a, "{{ user_item.local_user }}", -t, user, com.apple.access_ssh]
  register: access_ssh_aufnahme
  changed_when: user_item.local_user not in (access_ssh_gruppe.stdout | default(''))
  when:
    - ist_macos
    - access_ssh_gruppe.rc | default(1) == 0
    - user_item.local_user not in (access_ssh_gruppe.stdout | default(''))
  tags: [users]
