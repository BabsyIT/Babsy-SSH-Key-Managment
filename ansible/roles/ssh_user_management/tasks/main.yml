---
# Main tasks for SSH user management role

- name: Ensure required packages are installed
  ansible.builtin.apt:
    name:
      - sudo
      - curl
      - python3
      - jq
      - openssh-server
    state: present
    update_cache: true
  tags: [setup, packages]

- name: Create log directory
  ansible.builtin.file:
    path: "{{ log_dir }}"
    state: directory
    mode: '0755'
  when: enable_logging
  tags: [setup]

# Frühere Läufe legten bei jedem Durchgang Kopien mit Zeitstempel ab, ohne sie
# je aufzuräumen. Die Rolle schreibt keine mehr; was liegt, kommt einmalig weg.
#
# In einem Aufruf statt je Datei: Auf docker2 lagen mehrere tausend Kopien, und
# eine Aufgabe pro Datei (je eine SSH-Runde) hätte den Lauf stundenlang
# blockiert — der Probelauf am 15.09.2026 stand nach 15 Minuten erst bei 1331.
- name: Remove leftover backups from earlier runs
  ansible.builtin.command:
    argv:
      - find
      - "{{ backup_dir }}"
      - -maxdepth
      - "1"
      - -type
      - f
      - (
      - -name
      - "authorized_keys_github_*"
      - -o
      - -name
      - "sudoers_*"
      - )
      - -print
      - -delete
  register: alte_sicherungen
  changed_when: alte_sicherungen.stdout | length > 0
  failed_when: alte_sicherungen.rc != 0 and 'No such file or directory' not in alte_sicherungen.stderr
  tags: [setup, cleanup]

- name: Configure SSH daemon for dual authorized_keys files
  ansible.builtin.include_tasks: configure_sshd.yml
  tags: [sshd]

- name: Load user mapping from file
  ansible.builtin.set_fact:
    user_config: "{{ lookup('file', user_mapping_file) | from_json }}"
  tags: [always]

- name: Display user count
  ansible.builtin.debug:
    msg: "Managing {{ user_config.users | length }} users"
  tags: [always]

# Eine leere Liste hiesse für das Entfernen unten: alle raus. Das ist nie
# gewollt, sondern ein kaputtes Secret oder ein Fehler beim Schreiben.
- name: Refuse to run with an empty user list
  ansible.builtin.assert:
    that:
      - user_config.users is defined
      - user_config.users | length > 0
    fail_msg: "Die Benutzerliste ist leer — Lauf abgebrochen, bevor Zugänge entzogen werden."
  tags: [always]

- name: Ensure state directory exists
  ansible.builtin.file:
    path: "{{ managed_users_file | dirname }}"
    state: directory
    mode: '0755'
  tags: [setup]

- name: Process each user
  ansible.builtin.include_tasks: manage_user.yml
  loop: "{{ user_config.users }}"
  loop_control:
    loop_var: user_item
    label: "{{ user_item.local_user }}"
  tags: [users]

- name: Remove access that is no longer listed
  ansible.builtin.include_tasks: remove_users.yml
  tags: [users, remove]

- name: Create deployment log entry
  changed_when: false
  ansible.builtin.lineinfile:
    path: "{{ log_dir }}/deployment.log"
    line: "{{ ansible_date_time.iso8601 }} - Deployed {{ user_config.users | length }} users to {{ inventory_hostname }}"
    create: true
    mode: '0644'
  when: enable_logging
  tags: [logging]
