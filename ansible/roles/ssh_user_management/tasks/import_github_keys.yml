---
# Import SSH keys from GitHub for a user

- name: "{{ user_item.local_user }} | Fetch SSH keys from GitHub"
  ansible.builtin.uri:
    url: "{{ github_keys_base_url }}/{{ user_item.github_user }}.keys"
    return_content: true
    status_code: [200, 404]
  register: github_keys_response
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Debug GitHub keys response"
  ansible.builtin.debug:
    msg: "Found {{ github_keys_response.content.split('\n') | select | list | length }} SSH keys for {{ user_item.github_user }}"
  when: github_keys_response.status == 200
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Ensure .ssh directory exists"
  ansible.builtin.file:
    path: "{{ user_home_base }}/{{ user_item.local_user }}/.ssh"
    state: directory
    owner: "{{ user_item.local_user }}"
    group: "{{ user_item.local_user }}"
    mode: '0700'
  tags: [ssh_keys]

# Die Datei wird bei jedem Lauf vollständig neu geschrieben — sie gehört allein
# dieser Automatik. Was jemand von Hand hineinschreibt, ist beim nächsten Lauf
# weg; von Hand gepflegte Schlüssel gehören in ~/.ssh/authorized_keys.
#
# Auch leer: Vorher blieb die Datei unangetastet, sobald GitHub keinen
# Schlüssel mehr lieferte (Bedingung "content | length > 0"). Wer seine
# Schlüssel bei GitHub löschte, behielt damit den Zugang. 404 heisst, das
# GitHub-Konto gibt es nicht mehr — auch dann bleibt nichts stehen. Andere
# Antworten (Netzfehler, 5xx) lassen den Fetch oben scheitern, und die Datei
# bleibt, wie sie ist, statt versehentlich alle auszusperren.
#
# Ohne Sicherungskopie: Bis 09/2026 legte jeder Lauf eine Kopie mit Zeitstempel
# an und räumte sie nie auf — auf docker1.test lagen nach wenigen Wochen über
# fünfhundert. Den Inhalt kann jeder Lauf aus GitHub und dem Cockpit neu bilden.
- name: "{{ user_item.local_user }} | Write authorized_keys_github"
  ansible.builtin.copy:
    content: |
      # Automatisch verwaltet von Babsy-SSH-Key-Managment
      # GitHub: {{ user_item.github_user }}
      # Zuletzt geschrieben: {{ ansible_date_time.iso8601 }}
      # NICHT VON HAND ÄNDERN — wird bei jedem Lauf überschrieben.
      # Eigene Schlüssel gehören in ~/.ssh/authorized_keys.

      {% if github_keys_response.status == 200 %}{{ github_keys_response.content | trim }}{% endif %}

      {% for key in user_item.ssh_keys | default([]) %}
      {{ key }}
      {% endfor %}
    dest: "{{ user_home_base }}/{{ user_item.local_user }}/.ssh/authorized_keys_github"
    owner: "{{ user_item.local_user }}"
    group: "{{ user_item.local_user }}"
    mode: '0600'
    backup: false
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Create/preserve manual authorized_keys file"
  ansible.builtin.file:
    path: "{{ user_home_base }}/{{ user_item.local_user }}/.ssh/authorized_keys"
    state: touch
    owner: "{{ user_item.local_user }}"
    group: "{{ user_item.local_user }}"
    mode: '0600'
    modification_time: preserve
    access_time: preserve
  when: github_keys_response.status == 200
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Add header to manual authorized_keys"
  ansible.builtin.blockinfile:
    path: "{{ user_home_base }}/{{ user_item.local_user }}/.ssh/authorized_keys"
    marker: "# {mark} SSH-USER-MANAGEMENT HEADER"
    block: |
      # Manual SSH Keys - Add your keys below
      # GitHub-managed keys are in: ~/.ssh/authorized_keys_github
      # Both files are used for authentication
    create: true
    owner: "{{ user_item.local_user }}"
    group: "{{ user_item.local_user }}"
    mode: '0600'
  when: github_keys_response.status == 200
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Log SSH key import"
  # Das Protokoll ist Nachweis, keine Änderung am System — sonst meldete jeder
  # Lauf "changed", auch wenn sich an den Zugängen nichts getan hat.
  changed_when: false
  ansible.builtin.lineinfile:
    path: "{{ log_dir }}/ssh_keys.log"
    line: "{{ ansible_date_time.iso8601 }} - Imported {{ github_keys_response.content.split('\n') | select | list | length }} keys for {{ user_item.local_user }} from GitHub user {{ user_item.github_user }}"
    create: true
    mode: '0644'
  when:
    - enable_logging
    - github_keys_response.status == 200
  tags: [ssh_keys, logging]

- name: "{{ user_item.local_user }} | Warn if no keys found"
  ansible.builtin.debug:
    msg: "WARNING: No SSH keys found for GitHub user {{ user_item.github_user }}"
  when: github_keys_response.status != 200 or github_keys_response.content | length == 0
  tags: [ssh_keys]
