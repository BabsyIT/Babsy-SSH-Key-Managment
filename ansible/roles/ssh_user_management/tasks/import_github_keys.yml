---
# Import SSH keys from GitHub for a user

- name: "{{ user_item.local_user }} | Fetch SSH keys from GitHub"
  ansible.builtin.uri:
    url: "{{ github_keys_base_url }}/{{ user_item.github_user }}.keys"
    return_content: true
    status_code: [200, 404]
  register: github_keys_response
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Debug GitHub keys response"
  ansible.builtin.debug:
    msg: "Found {{ github_keys_response.content.split('\n') | select | list | length }} SSH keys for {{ user_item.github_user }}"
  when: github_keys_response.status == 200
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Backup existing authorized_keys_github"
  ansible.builtin.copy:
    src: "{{ user_home_base }}/{{ user_item.local_user }}/.ssh/authorized_keys_github"
    dest: "{{ backup_dir }}/authorized_keys_github_{{ user_item.local_user }}_{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: '0600'
  when:
    - create_backups
    - github_keys_response.status == 200
  ignore_errors: true
  tags: [ssh_keys, backup]

# Ohne Schluessel aus einer der beiden Quellen entstuende ein Konto, auf das
# niemand kommt. Beides zusammen entscheidet, ob geschrieben wird.
- name: "{{ user_item.local_user }} | Determine keys to deploy"
  ansible.builtin.set_fact:
    managed_keys: >-
      {{ ((github_keys_response.content | default('')).split('\n') | select | list
          if github_keys_response.status == 200 else [])
         + (user_item.ssh_keys | default([])) }}
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Ensure .ssh directory exists"
  ansible.builtin.file:
    path: "{{ user_home_base }}/{{ user_item.local_user }}/.ssh"
    state: directory
    owner: "{{ user_item.local_user }}"
    group: "{{ user_item.local_user }}"
    mode: '0700'
  when: managed_keys | length > 0
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Write SSH keys to authorized_keys_github (separate file)"
  ansible.builtin.copy:
    content: |
      # Automatisch verwaltete Schluessel — nicht von Hand bearbeiten.
      # Quellen: github.com/{{ user_item.github_user }}.keys und im Cockpit hinterlegte Schluessel.
      # Stand: {{ ansible_date_time.iso8601 }}
      # Eigene, nicht verwaltete Schluessel gehoeren in ~/.ssh/authorized_keys

      {% for key in managed_keys %}
      {{ key }}
      {% endfor %}
    dest: "{{ user_home_base }}/{{ user_item.local_user }}/.ssh/authorized_keys_github"
    owner: "{{ user_item.local_user }}"
    group: "{{ user_item.local_user }}"
    mode: '0600'
  when: managed_keys | length > 0
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Create/preserve manual authorized_keys file"
  ansible.builtin.file:
    path: "{{ user_home_base }}/{{ user_item.local_user }}/.ssh/authorized_keys"
    state: touch
    owner: "{{ user_item.local_user }}"
    group: "{{ user_item.local_user }}"
    mode: '0600'
    modification_time: preserve
    access_time: preserve
  when: managed_keys | length > 0
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Add header to manual authorized_keys"
  ansible.builtin.blockinfile:
    path: "{{ user_home_base }}/{{ user_item.local_user }}/.ssh/authorized_keys"
    marker: "# {mark} SSH-USER-MANAGEMENT HEADER"
    block: |
      # Eigene, nicht verwaltete Schluessel hier eintragen.
      # Verwaltete Schluessel stehen in: ~/.ssh/authorized_keys_github
      # sshd nutzt beide Dateien.
    create: true
    owner: "{{ user_item.local_user }}"
    group: "{{ user_item.local_user }}"
    mode: '0600'
  when: managed_keys | length > 0
  tags: [ssh_keys]

- name: "{{ user_item.local_user }} | Log SSH key import"
  ansible.builtin.lineinfile:
    path: "{{ log_dir }}/ssh_keys.log"
    line: "{{ ansible_date_time.iso8601 }} - {{ managed_keys | length }} Schluessel fuer {{ user_item.local_user }} (GitHub: {{ user_item.github_user }}, Cockpit: {{ user_item.ssh_keys | default([]) | length }})"
    create: true
    mode: '0644'
  when:
    - enable_logging
    - managed_keys | length > 0
  tags: [ssh_keys, logging]

- name: "{{ user_item.local_user }} | Warn if no keys found"
  ansible.builtin.debug:
    msg: "WARNUNG: Kein Schluessel fuer {{ user_item.local_user }} — weder bei GitHub ({{ user_item.github_user }}) noch im Cockpit. Das Konto entsteht ohne Zugang."
  when: managed_keys | length == 0
  tags: [ssh_keys]
